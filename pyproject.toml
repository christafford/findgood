[project]
name = "findgood"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "psycopg2-binary>=2.9",
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
findgood = "findgood.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
